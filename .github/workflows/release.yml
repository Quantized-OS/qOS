name: Publish verified qOS source release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'Quantized-OS/qOS'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use the repository Node.js version
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Verify that the tag matches package.json
        shell: bash
        run: |
          set -Eeuo pipefail
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          test "${GITHUB_REF_NAME}" = "v${package_version}"

      - name: Run offline source checks
        run: make check

      - name: Build deterministic GitHub assets
        run: python3 scripts/build-github-release.py --output release-artifacts/github-release

      - name: Publish the verified tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            release-artifacts/github-release/qos-source.tar.gz \
            release-artifacts/github-release/SHA256SUMS.txt \
            release-artifacts/github-release/RELEASE.json \
            --verify-tag \
            --generate-notes \
            --title "qOS ${GITHUB_REF_NAME}"
